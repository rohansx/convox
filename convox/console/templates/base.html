<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/static/console/favicon.svg" type="image/svg+xml">
  <title>{% block title %}Convox console{% endblock %}</title>
  <link rel="stylesheet" href="/static/console/console.css">
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js" defer></script>
  <script src="https://unpkg.com/htmx-ext-sse@2.2.2/sse.js" defer></script>
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <header class="topbar">
    <a class="brand" href="/console">convox</a>
    <nav>
      <a href="/console">Calls</a>
      <a href="/ward">Ward</a>
    </nav>
    <span class="live" id="live" title="live connection"><i></i><span>connecting</span></span>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
