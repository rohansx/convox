<!doctype html>
<html lang="{{ short }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f6f4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>{{ me.native }} · dubhash</title>
  <link rel="stylesheet" href="/static/console/join.css">
</head>
<body class="phone" data-state="idle">
<main class="phone-main" id="phone"
      data-call-id="{{ call_id }}" data-side="{{ side }}" data-lang="{{ me.lang }}"
      data-ws="{{ ws_path }}" data-worklet="/static/console/join_worklet.js" data-events="{{ events_url }}"
      data-ui="{{ ui | tojson | forceescape }}">
  <header class="phone-top">
    <h1 class="phone-lang" lang="{{ short }}">{{ me.native }}</h1>
    <p class="phone-with">⇄ <span lang="{{ other.lang[:2] }}">{{ other.native }}</span>{% if me.english != me.native %} · <span lang="en">{{ me.english }}</span>{% endif %}</p>
  </header>

  <section class="phone-stage">
    <button type="button" class="tap" id="tap">
      <span class="tap-native">{{ ui.start }}</span>
      {% if ui.start != ui_en.start %}<span class="tap-en" lang="en">{{ ui_en.start }}</span>{% endif %}
    </button>
    <div class="orb" id="orb" hidden>
      <div class="orb-ring"></div>
      <div class="orb-core"></div>
      <p class="orb-text" id="orb-text">{{ ui.connecting }}</p>
    </div>
    <p class="phone-status" id="status" lang="en"></p>
  </section>

  <section class="phone-lines" id="lines" aria-live="polite"></section>

  <footer class="phone-bottom">
    <button type="button" class="leave" id="leave" hidden>
      {{ ui.leave }}{% if ui.leave != ui_en.leave %} <small lang="en">{{ ui_en.leave }}</small>{% endif %}
    </button>
  </footer>
</main>

<script src="/static/console/join_phone.js" defer></script>
</body>
</html>
