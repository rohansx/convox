# Delivery phrase pack (L10): short lines a rider and a customer repeat. Per call the session
# prefills the MT and TTS caches with the canonical (first) text in the language each side's
# STT outputs: English on the pivot sides (stt: sarvam-translate), else the side's own
# language. A final that matches a line after normalisation (interp/phrases.py) is served
# from those caches; acks ("ack: true") on an idle floor become real turns.
#
# TODO(native review): every hi, mr, gu, kn and ta text below was written by us and needs
# a native speaker's check (spelling as STT writes it, register, gender: the rider lines
# are in the masculine). The texts are SOURCE lines only; translations always come from MT.
# Extra texts on a line are other spellings of the same words (romanised, contractions,
# digits), never synonyms: a match is voiced as the line's first text.
vertical: delivery
numbers_readback: true  # a number in a turn must survive translation (interp/numbers.py)
native_review_todo: [hi, mr, gu, kn, ta]
lines:
  - {id: ok, ack: true, en: [Okay], hi: [ठीक है, theek hai], mr: [ठीक आहे, theek aahe], gu: [સારું], kn: [ಸರಿ, sari], ta: [சரி]}
