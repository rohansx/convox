# Per language pair. A side's tts/voice_* is the voice its language is spoken in, so it is
# used when that side is the TARGET. stt: sarvam | sarvam-translate | deepgram | fake.
# mt_src (optional): MT source language when the STT outputs another language (default lang).
# tts: bulbul | eleven | fake.
# Voice ids may be placeholders or real vendor ids; both work. Placeholders resolve in code
# (providers/sarvam_tts.py, providers/eleven_tts.py) to real voices that STILL NEED THE
# LISTENING TEST (open question 3):
#   *-male-1 / *-female-1 (bulbul) -> bulbul:shubh / bulbul:ishita (Bulbul v3)
#   hi-male-1 / hi-female-1 (eleven) -> eleven:jjlrvsvJ1M0ZMRNgZuLO "Karan" /
#                                       eleven:KYiVPerWcenyBTIvWbfY "Sia"
# Placeholders are kept here because tests/test_foundation.py asserts them.

hi-kn:
  a: { lang: hi-IN, stt: sarvam, tts: eleven, voice_m: "eleven:hi-male-1", voice_f: "eleven:hi-female-1" }
  b: { lang: kn-IN, stt: sarvam, tts: bulbul, voice_m: "bulbul:kn-male-1", voice_f: "bulbul:kn-female-1" }
  eou_ms: 550
  backchannel_max_ms: 600
  barge_in_min_ms: 1200
  duck_db: -14

# Pivot trial (open question L1): Sarvam speech->English (mode=translate) on side a, then
# en->kn MT. Opt-in by key; find_pair("hi-IN", "kn-IN") still returns hi-kn.
# See providers/README.md "Pivot trial (L1)".
hi-kn-pivot:
  a: { lang: hi-IN, stt: sarvam-translate, mt_src: en-IN, tts: eleven, voice_m: "eleven:hi-male-1", voice_f: "eleven:hi-female-1" }
  b: { lang: kn-IN, stt: sarvam, tts: bulbul, voice_m: "bulbul:kn-male-1", voice_f: "bulbul:kn-female-1" }
  eou_ms: 550
  backchannel_max_ms: 600
  barge_in_min_ms: 1200
  duck_db: -14

