# Per language pair. A side's tts/voice_* is the voice its language is spoken in, so it is
# used when that side is the TARGET. stt: sarvam | sarvam-translate | deepgram | fake.
# mt_src (optional): MT source language when the STT outputs another language (default lang).
# tts: bulbul | eleven | fake.
#
# Decisions of 21 Oct 2026 (docs/plan/open-questions.md L1, ADR 0008):
# - Bulbul speaks every target including Hindi. ElevenLabs stays wired (tts: eleven) but is
#   off the default path: the free tier cannot use library voices over the API.
# - hi->kn uses the pivot on the Hindi side: Sarvam speech->English (stt: sarvam-translate)
#   then en->kn MT, ~670 ms faster than hi->kn at p50 live. The direct route is hi-kn-direct.
#   Kannada quality still needs a native speaker's check.
#
# Voice ids are placeholders that resolve in providers/sarvam_tts.py to Bulbul v3 voices
# (*-male-1 -> shubh, *-female-1 -> ishita). They STILL NEED THE LISTENING TEST (Q3).
# spec_mt / spec_after_ms: speculative MT on the latest STT partial during the EOU wait. Off:
# Sarvam realtime partials rarely match the final (live hit 1/8, L1a).
# early_final_ms (default 0 = off): end the STT stream after this much silence, before EOU,
# so MT/TTS run during the EOU wait; restarted on the whole utterance if speech resumes.
# hi-kn: 200 (L3, live first-audio p50 1727 -> 1377 ms, 20/20 finals identical; half of
# the early finals are discarded on comma pauses, costing an extra STT stream each and
# rarely a cancelled MT call).
# max_utterance_ms (default 7000, not set below): an utterance that has run this long ends at
# the next pause between words (L7), so a noisy room or a monologue is never held back.

hi-kn:
  a: { lang: hi-IN, stt: sarvam-translate, mt_src: en-IN, tts: bulbul, voice_m: "bulbul:hi-male-1", voice_f: "bulbul:hi-female-1" }
  b: { lang: kn-IN, stt: sarvam, tts: bulbul, voice_m: "bulbul:kn-male-1", voice_f: "bulbul:kn-female-1" }
  eou_ms: 550
  backchannel_max_ms: 600
  barge_in_min_ms: 1200
  duck_db: -14
  spec_mt: false
  spec_after_ms: 200
  early_final_ms: 200

hi-kn-direct:
  a: { lang: hi-IN, stt: sarvam, tts: bulbul, voice_m: "bulbul:hi-male-1", voice_f: "bulbul:hi-female-1" }
  b: { lang: kn-IN, stt: sarvam, tts: bulbul, voice_m: "bulbul:kn-male-1", voice_f: "bulbul:kn-female-1" }
  eou_ms: 550
  backchannel_max_ms: 600
  barge_in_min_ms: 1200
  duck_db: -14
  spec_mt: false
  spec_after_ms: 200

hi-ta:
  a: { lang: hi-IN, stt: sarvam, tts: bulbul, voice_m: "bulbul:hi-male-1", voice_f: "bulbul:hi-female-1" }
  b: { lang: ta-IN, stt: sarvam, tts: bulbul, voice_m: "bulbul:ta-male-1", voice_f: "bulbul:ta-female-1" }
  eou_ms: 550
  backchannel_max_ms: 600
  barge_in_min_ms: 1200
  duck_db: -14
  spec_mt: false
  spec_after_ms: 200

# mr-hi (L4): the pivot on BOTH sides (Sarvam speech->English, then en->hi / en->mr) plus
# early_final_ms 200. Live heard first-audio p50/p95 2500/3240 (mr->hi) and 2480/2580
# (hi->mr) direct -> 1580/1940 and 1540/1720; numbers kept (the direct route turned "सहा
# वाजता" into "six बजे"). Direct mr<->hi MT takes ~1.3 s, about two en hops (as hi->kn, L1).
# Marathi quality still needs a native speaker's check. The direct route is mr-hi-direct.
mr-hi:
  a: { lang: mr-IN, stt: sarvam-translate, mt_src: en-IN, tts: bulbul, voice_m: "bulbul:mr-male-1", voice_f: "bulbul:mr-female-1" }
  b: { lang: hi-IN, stt: sarvam-translate, mt_src: en-IN, tts: bulbul, voice_m: "bulbul:hi-male-1", voice_f: "bulbul:hi-female-1" }
  eou_ms: 550
  backchannel_max_ms: 600
  barge_in_min_ms: 1200
  duck_db: -14
  spec_mt: false
  spec_after_ms: 200
  early_final_ms: 200

mr-hi-direct:
  a: { lang: mr-IN, stt: sarvam, tts: bulbul, voice_m: "bulbul:mr-male-1", voice_f: "bulbul:mr-female-1" }
  b: { lang: hi-IN, stt: sarvam, tts: bulbul, voice_m: "bulbul:hi-male-1", voice_f: "bulbul:hi-female-1" }
  eou_ms: 550
  backchannel_max_ms: 600
  barge_in_min_ms: 1200
  duck_db: -14
  spec_mt: false
  spec_after_ms: 200

# Marathi <-> English (L4). The Marathi side's STT outputs English (sarvam-translate), which
# is already the listener's language, so the pipeline skips MT (t_mt = t_stt_final). The
# English side is Sarvam STT in en-IN, then en->mr MT. find_pair also serves en-IN on side a
# (it swaps sides), so there is no en-mr entry.
mr-en:
  a: { lang: mr-IN, stt: sarvam-translate, mt_src: en-IN, tts: bulbul, voice_m: "bulbul:mr-male-1", voice_f: "bulbul:mr-female-1" }
  b: { lang: en-IN, stt: sarvam, tts: bulbul, voice_m: "bulbul:en-male-1", voice_f: "bulbul:en-female-1" }
  eou_ms: 550
  backchannel_max_ms: 600
  barge_in_min_ms: 1200
  duck_db: -14
  spec_mt: false
  spec_after_ms: 200
  early_final_ms: 200

# Gujarati (L6) follows the tuned Marathi pattern: gu-hi pivots both sides through English
# (Sarvam speech->English, then en->hi / en->gu) with early_final_ms 200; gu-hi-direct is
# the plain route (gu<->hi MT). gu-en: the Gujarati side's STT outputs English, so MT is
# skipped; the English side is en-IN STT then en->gu. Gujarati quality needs a native check.
# Live heard first-audio p50/p95: gu-hi 1500/1640 (gu->hi), 1460/1700 (hi->gu); direct
# 2400/2540, 2600/4860; gu-en 800/980 (gu->en), 1480/1580 (en->gu). Both gu-hi routes lost
# "OTP 4729 છે" as 47296 ("છે" heard as "છ", six); gu-en kept every number.
gu-hi:
  a: { lang: gu-IN, stt: sarvam-translate, mt_src: en-IN, tts: bulbul, voice_m: "bulbul:gu-male-1", voice_f: "bulbul:gu-female-1" }
  b: { lang: hi-IN, stt: sarvam-translate, mt_src: en-IN, tts: bulbul, voice_m: "bulbul:hi-male-1", voice_f: "bulbul:hi-female-1" }
  eou_ms: 550
  backchannel_max_ms: 600
  barge_in_min_ms: 1200
  duck_db: -14
  spec_mt: false
  spec_after_ms: 200
  early_final_ms: 200

gu-hi-direct:
  a: { lang: gu-IN, stt: sarvam, tts: bulbul, voice_m: "bulbul:gu-male-1", voice_f: "bulbul:gu-female-1" }
  b: { lang: hi-IN, stt: sarvam, tts: bulbul, voice_m: "bulbul:hi-male-1", voice_f: "bulbul:hi-female-1" }
  eou_ms: 550
  backchannel_max_ms: 600
  barge_in_min_ms: 1200
  duck_db: -14
  spec_mt: false
  spec_after_ms: 200

gu-en:
  a: { lang: gu-IN, stt: sarvam-translate, mt_src: en-IN, tts: bulbul, voice_m: "bulbul:gu-male-1", voice_f: "bulbul:gu-female-1" }
  b: { lang: en-IN, stt: sarvam, tts: bulbul, voice_m: "bulbul:en-male-1", voice_f: "bulbul:en-female-1" }
  eou_ms: 550
  backchannel_max_ms: 600
  barge_in_min_ms: 1200
  duck_db: -14
  spec_mt: false
  spec_after_ms: 200
  early_final_ms: 200

